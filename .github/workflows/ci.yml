name: CI

# Senvoryn OS — continuous integration.
#
# These jobs validate the CONTRACT PACK only. They say nothing about an
# operating system, because no operating system exists in this repository.
# Any job that would imply a security claim about a running system is out of
# scope here by design.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  contract-tests:
    name: Contract tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run contract test suite
        env:
          PYTHONPATH: reference
        run: python -m unittest discover -s tests -v

  rust:
    name: Rust workspace (format, lint, test, release build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build the release artefacts
        run: cargo build --workspace --release

  conformance-agreement:
    name: Conformance agreement (Python and Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Run the Python reference model against the shared vectors
        env:
          PYTHONPATH: reference
        run: python -m unittest tests.test_conformance_vectors -v

      - name: Run the Rust implementation against the shared vectors
        run: cargo test -p senvoryn-scp --test conformance_vectors

  mutation-gate:
    name: Mutation gate (every control has a test that fails when it is broken)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Break each control and require a named test to go red
        run: python scripts/mutation-gate.py

  schema-validation:
    name: JSON Schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate schemas and fixtures
        env:
          PYTHONPATH: reference
        run: python -m unittest tests.test_schema_contracts -v

      - name: Lint every JSON document in the repository
        run: python scripts/check-json.py

  pack-integrity:
    name: Contract artifact integrity (SHA-256)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify the checksum manifest
        run: python scripts/generate-checksums.py --check

  normative-language:
    name: Claim discipline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check status declarations and absence of absolute claims
        run: python scripts/check-normative-language.py

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

  yaml-lint:
    name: Workflow and configuration lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Parse every YAML document in the repository
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          try:
              import yaml
          except ImportError:
              print("SKIP: PyYAML not installed")
              sys.exit(0)

          failures = 0
          checked = 0
          for path in sorted(Path(".").rglob("*.yml")) + sorted(Path(".").rglob("*.yaml")):
              if any(part in {".git", "node_modules"} for part in path.parts):
                  continue
              checked += 1
              try:
                  list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
              except Exception as exc:
                  failures += 1
                  print(f"FAIL  {path}: {exc}")
          print(f"{checked - failures}/{checked} YAML document(s) parse cleanly")
          sys.exit(1 if failures else 0)
          PY

  link-check:
    name: Internal link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify relative Markdown links resolve
        run: python scripts/check-links.py
