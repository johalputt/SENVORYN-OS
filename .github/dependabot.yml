# Senvoryn OS — Dependabot configuration
#
# Dependency updates are reviewed, never auto-merged. An unreviewed dependency
# bump is a supply-chain change (see INV-20 and the threat model, AS-16).

version: 2

updates:
  # GitHub Actions used by CI
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns:
          - "*"

  # Python development requirements (jsonschema, etc.)
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "build(deps)"
    groups:
      python-dev:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
